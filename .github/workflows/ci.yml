name: Public NSIS in-place upgrade QA
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'Showrenzhe/jiajian' && startsWith(github.ref_name, 'codex/')
    runs-on: windows-2022
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        mode: [ui, manual]
    name: v0.8.9 to v0.9.0 / ${{ matrix.mode }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Verify installed Windows client
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          QA_RUNNER_TYPE: ${{ runner.environment }}
        run: ./qa/hosted-upgrade.ps1 -Mode ${{ matrix.mode }}
