name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      integrated_gpu:
        description: 同时在已登记的内部 Windows 集成显卡机器上采样
        type: boolean
        default: false
  schedule:
    - cron: '17 3 * * *'
permissions:
  contents: read
jobs:
  checks:
    name: Windows / 单元与桌面冒烟
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: |
          ./scripts/prepare-release-tools.ps1
          (Resolve-Path tools/ffmpeg-8.0-full_build/bin).Path >> $env:GITHUB_PATH
      - run: npm test
      - run: npm run test:smoke
      - if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: npm run test:desktop
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-diagnostics
          path: run-data/test-artifacts/
          if-no-files-found: ignore
          retention-days: 7
  benchmark:
    name: Windows / 大工程帧间隔
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      REPORTS_DIR: run-data/benchmarks/paired
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          path: head
          fetch-depth: 2
          persist-credentials: false
      - name: 确定参与比较的提交
        id: baseline
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          New-Item -ItemType Directory -Path $env:REPORTS_DIR -Force | Out-Null
          try {
            $eventName = $env:GITHUB_EVENT_NAME
            if ($eventName -eq 'pull_request') {
              $base = $env:PR_BASE
            } elseif ($eventName -eq 'push' -and $env:PUSH_BEFORE -ne ('0' * 40)) {
              $base = $env:PUSH_BEFORE
            } elseif ($eventName -in 'push','schedule','workflow_dispatch') {
              # 首次推送分支、定时或手动运行时，以被测提交的第一父提交为准。
              $parents = git -C head rev-list --parents -n 1 HEAD
              if ($LASTEXITCODE) { throw '无法读取被测提交的父提交' }
              $base = ($parents -split ' ')[1]
            }
            if ($base -notmatch '^[0-9a-f]{40}$' -or $base -eq ('0' * 40) -or $base -eq $env:GITHUB_SHA) {
              throw '缺少独立的基线提交，当前运行无法进行性能比较'
            }
            "sha=$base" >> $env:GITHUB_OUTPUT
            "event=$eventName base=$base head=$env:GITHUB_SHA" | Tee-Object "$env:REPORTS_DIR/revisions.txt"
          } catch {
            $_.Exception.Message > "$env:REPORTS_DIR/baseline-error.txt"
            throw
          }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ steps.baseline.outputs.sha }}
          path: base
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: head/package-lock.json
      - name: 在同一台机器依次采样基线、候选、候选、基线
        id: sample
        env:
          BASE_SHA: ${{ steps.baseline.outputs.sha }}
        run: ./head/scripts/run-paired-bench.ps1
      - name: 汇总并对比同机采样
        if: ${{ !cancelled() && steps.sample.outcome != 'skipped' }}
        run: |
          node head/scripts/compare-bench.cjs --paired $env:REPORTS_DIR 2>&1 | Tee-Object "$env:REPORTS_DIR/compare.log"
          exit $LASTEXITCODE
      - name: 记录比较前的失败
        if: failure()
        run: |
          New-Item -ItemType Directory -Path $env:REPORTS_DIR -Force | Out-Null
          $summary = Join-Path $env:REPORTS_DIR 'summary.json'
          if (!(Test-Path -LiteralPath $summary)) {
            @{ status = 'invalid'; head = $env:GITHUB_SHA; errors = @('未生成配对汇总，请查看本次作业中最早失败的步骤。') } |
              ConvertTo-Json > $summary
          }
      - name: 保存每轮证据和比较结果
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: benchmark-large
          path: ${{ env.REPORTS_DIR }}
          retention-days: 30
          if-no-files-found: warn
  integrated-graphics:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.integrated_gpu &&
      vars.INTERNAL_RUNNER_ENABLED == 'true' &&
      github.ref_type == 'branch' &&
      github.ref_name == github.event.repository.default_branch
    runs-on: [self-hosted, Windows, integrated-graphics]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: npm ci
      - run: |
          ./scripts/prepare-release-tools.ps1
          (Resolve-Path tools/ffmpeg-8.0-full_build/bin).Path >> $env:GITHUB_PATH
      - run: npm run bench:large
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: benchmark-integrated-graphics
          path: run-data/benchmarks/large.json
