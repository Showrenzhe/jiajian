name: 构建内部 Windows 安装包
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 已合入 main 的版本标签
        type: string
        required: true
permissions:
  contents: read
jobs:
  release:
    if: github.event.repository.private
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      JIAJIAN_UPDATE_URL: ${{ vars.JIAJIAN_UPDATE_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: |
          if (!$env:JIAJIAN_UPDATE_URL) { throw '请配置内部 HTTPS 更新目录 JIAJIAN_UPDATE_URL。' }
          git merge-base --is-ancestor HEAD refs/remotes/origin/main
          if ($LASTEXITCODE) { throw '标签尚未合入 main。' }
      - run: npm ci
      - run: node scripts/release-notes.cjs $env:RELEASE_TAG "$env:RUNNER_TEMP/notes.md"
      - run: ./scripts/prepare-release-tools.ps1
      - run: npm run dist:win -- "-c.releaseInfo.releaseNotesFile=$env:RUNNER_TEMP/notes.md"
      - run: node scripts/verify-release.cjs "$env:RUNNER_TEMP/notes.md"
      - uses: actions/upload-artifact@v4
        with:
          name: internal-windows-${{ inputs.tag }}
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/*.yml
            !dist/builder*.yml
          if-no-files-found: error
